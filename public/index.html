<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Status · Wessel Smit</title>
  <meta name="description" content="Actuele status en uptime van de sites van Wessel Smit.">
  <meta name="theme-color" content="#0b0c0e">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%230b0c0e'/><path d='M18 28h14l8 38 10-38h0l10 38 8-38h14L68 76H56L50 52 44 76H32Z' fill='%23ff5a1f'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0c0e;
      --panel: #111316;
      --border: #23272d;
      --text: #e7e9ec;
      --muted: #7c838d;
      --green: #3ddc97;
  --ok: #3ddc97;
  --accent: #ff5a1f;
      --cyan: #aab2bd;
      --amber: #ffb020;
      --red: #ff4d5e;
      --empty: rgba(122, 138, 168, 0.18);
      --radius: 0;
      --display: "Archivo", system-ui, sans-serif;
  --font: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    ::selection { background: var(--accent); color: var(--bg); }


    /* ---------- Navigatie ---------- */
    .nav {
      position: sticky;
      top: 0;
      z-index: 40;
      background: rgba(11, 12, 14, 0.85);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
    }

    .nav-inner {
      max-width: 880px;
      margin: 0 auto;
      padding: 0.8rem 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      font-size: 0.85rem;
    }

    .nav-prompt {
      text-decoration: none;
      color: inherit;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .user { color: var(--accent); }
    .path { color: var(--cyan); }

    .caret {
      display: inline-block;
      width: 0.55em;
      height: 1em;
      background: var(--accent);
      vertical-align: -0.12em;
      margin-left: 0.2em;
      animation: blink 1s steps(1) infinite;
    }

    @keyframes blink { 50% { opacity: 0; } }

    .back {
      flex-shrink: 0;
      font-size: 0.8rem;
      color: var(--muted);
      text-decoration: none;
      padding: 0.35rem 0.6rem;
      border-radius: 0;
      transition: color 0.2s, background 0.2s;
    }

    .back:hover, .back:focus-visible {
      color: var(--accent);
      background: rgba(255, 90, 31, 0.08);
      outline: none;
    }

    /* ---------- Inhoud ---------- */
    main {
      position: relative;
      z-index: 2;
      flex: 1;
      width: 100%;
      max-width: 880px;
      margin: 0 auto;
      padding: 3.5rem 1rem 4rem;
    }

    .section-head { margin-bottom: 2rem; }
    .section-head .cmd { font-size: 0.85rem; color: var(--accent); }
    .section-head .cmd::before { content: "$ "; color: var(--muted); }

    .section-head h1 {
      font-size: clamp(1.8rem, 6vw, 2.6rem);
      font-weight: 800;
      color: #fff;
      margin-top: 0.25rem;
    }

    /* Samenvatting bovenaan */
    .summary {
      display: flex;
      align-items: center;
      gap: 0.9rem;
      padding: 1.1rem 1.25rem;
      margin-bottom: 1.5rem;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 0;
      --c: var(--muted);
    }

    .summary.up { --c: var(--ok); }
    .summary.degraded { --c: var(--amber); }
    .summary.down { --c: var(--red); }

    .summary { border-color: color-mix(in srgb, var(--c) 45%, transparent); }

    .summary strong { color: #fff; font-size: 1rem; }
    .summary .meta { margin-left: auto; font-size: 0.75rem; color: var(--muted); text-align: right; }

    .dot {
      flex-shrink: 0;
      width: 0.75rem;
      height: 0.75rem;
      border-radius: 0;
      background: var(--c);
    }

    .up .dot, .dot.up { animation: pulse 2s ease-in-out infinite; }

    @keyframes pulse { 50% { box-shadow: 0 0 2px var(--c); } }

    /* Services */
    .services { display: flex; flex-direction: column; gap: 1rem; }

    .service {
      padding: 1.25rem;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 0;
      animation: fade-in 0.5s ease both;
      animation-delay: calc(var(--i, 0) * 0.08s);
      --c: var(--muted);
    }

    .service.up { --c: var(--ok); }
    .service.degraded { --c: var(--amber); }
    .service.down { --c: var(--red); }

    @keyframes fade-in { from { opacity: 0; transform: translateY(12px); } }

    .service-head {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      flex-wrap: wrap;
    }

    .service-head h2 { font-size: 1rem; color: #fff; }

    .service-head a {
      font-size: 0.75rem;
      color: var(--cyan);
      text-decoration: none;
    }

    .service-head a:hover { text-decoration: underline; }

    .state {
      margin-left: auto;
      font-size: 0.72rem;
      padding: 0.15rem 0.6rem;
      border-radius: 0;
      color: var(--c);
      border: 1px solid currentColor;
      background: color-mix(in srgb, var(--c) 8%, transparent);
    }

    .bars {
      display: grid;
      grid-template-columns: repeat(var(--n, 90), 1fr);
      gap: 2px;
      height: 34px;
      margin-top: 1rem;
    }

    .bar {
      border-radius: 0;
      background: var(--empty);
      transition: transform 0.15s, filter 0.15s;
    }

    .bar.up { background: var(--ok); }
    .bar.degraded { background: var(--amber); }
    .bar.down { background: var(--red); }
    .bar:hover { transform: scaleY(1.15); filter: brightness(1.3); }

    .bars-foot {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      margin-top: 0.45rem;
      font-size: 0.7rem;
      color: var(--muted);
    }

    .bars-foot .uptime { color: var(--text); }

    .stats {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem 1.5rem;
      margin-top: 0.9rem;
      font-size: 0.75rem;
      color: var(--muted);
    }

    .stats b { color: var(--text); font-weight: 500; }

    .note {
      margin-top: 1.5rem;
      font-size: 0.75rem;
      color: var(--muted);
    }

    .legend { display: inline-flex; align-items: center; gap: 0.35rem; margin-right: 1rem; }
    .legend i { width: 0.6rem; height: 0.6rem; border-radius: 0; display: inline-block; }

    footer {
      position: relative;
      z-index: 2;
      text-align: center;
      font-size: 0.75rem;
      color: var(--muted);
      padding: 1.5rem 1rem;
      border-top: 1px solid var(--border);
    }

    @media (max-width: 560px) {
      .bars { gap: 1px; height: 28px; }
      .summary { flex-wrap: wrap; }
      .summary .meta { margin-left: 0; text-align: left; width: 100%; }
    }
    /* ---------- Tech-stijl, gelijk aan wesselsmit.com ---------- */
    .nav-inner { padding-top: 0; padding-bottom: 0; min-height: 52px; }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      min-width: 0;
      text-decoration: none;
      color: var(--text);
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      white-space: nowrap;
    }

    .brand-mark {
      flex: none;
      width: 26px;
      height: 26px;
      display: grid;
      place-items: center;
      background: var(--accent);
      color: var(--bg);
      font-family: var(--display);
      font-weight: 900;
      font-stretch: 125%;
      font-size: 0.85rem;
    }

    .brand-text { overflow: hidden; text-overflow: ellipsis; }
    .brand .crumb { color: var(--muted); font-weight: 400; }

    .back {
      font-size: 0.72rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .back:hover, .back:focus-visible { background: var(--panel); }

    h1, .section-head h1, .card h2, .service-head h2, dialog h2 {
      font-family: var(--display);
      font-stretch: 125%;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: -0.01em;
      line-height: 1;
    }

    .section-head h1 { font-size: clamp(2rem, 7vw, 3.4rem); margin-top: 0.6rem; }

    .section-head .cmd {
      font-size: 0.7rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .section-head .cmd::before { content: "■ "; color: var(--accent); }

    .card-icon {
      width: auto;
      height: auto;
      display: block;
      font-size: 0.7rem;
      letter-spacing: 0.14em;
      color: var(--muted);
      background: none;
      border: 0;
    }

    .card::after {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      height: 2px;
      width: 0;
      background: var(--accent);
      transition: width 0.35s ease;
    }

    .card:not(.disabled):hover::after, .card:not(.disabled):focus-visible::after { width: 100%; }
    .card:not(.disabled):hover { background: #16191d; }
    .card h2 { font-size: 1.35rem; }

    .card.disabled {
      filter: none;
      border-style: solid;
      background: repeating-linear-gradient(135deg, transparent 0 10px, rgba(255, 255, 255, 0.018) 10px 20px), var(--panel);
    }

    .badge, .state {
      font-size: 0.66rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .btn {
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 8px, 100% 100%, 0 100%);
    }

    .btn:not(.ghost):not(.danger):not(.warn):not(:disabled):hover { background: var(--text); border-color: var(--text); }

    .terminal-bar span { display: none; }

    .terminal-bar em {
      margin-left: 0;
      font-size: 0.68rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .terminal-bar em::before { content: "■ "; color: var(--accent); }

    .terminal { position: relative; }

    .terminal::before, .terminal::after {
      content: "";
      position: absolute;
      width: 10px;
      height: 10px;
      border: 0 solid var(--accent);
      pointer-events: none;
      z-index: 1;
    }

    .terminal::before { top: -1px; left: -1px; border-top-width: 2px; border-left-width: 2px; }
    .terminal::after { bottom: -1px; right: -1px; border-bottom-width: 2px; border-right-width: 2px; }

    footer {
      font-size: 0.68rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }


    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
      }
    }
  </style>
</head>
<body>

  <header class="nav">
    <nav class="nav-inner" aria-label="Navigatie">
      <a href="https://wesselsmit.com/" class="brand"><span class="brand-mark" aria-hidden="true">W</span><span class="brand-text">WESSEL SMIT <span class="crumb">/ STATUS</span></span></a>
      <a href="https://wesselsmit.com/" class="back">← portfolio</a>
    </nav>
  </header>

  <main>
    <div class="section-head">
      <div class="cmd">systemctl status --all</div>
      <h1>Status</h1>
    </div>

    <div class="summary" id="summary" role="status" aria-live="polite">
      <span class="dot" aria-hidden="true"></span>
      <strong id="summary-text">Status laden…</strong>
      <span class="meta" id="summary-meta"></span>
    </div>

    <div class="services" id="services"></div>

    <p class="note">
      <span class="legend"><i style="background: var(--green)"></i>online</span>
      <span class="legend"><i style="background: var(--amber)"></i>deels verstoord</span>
      <span class="legend"><i style="background: var(--red)"></i>storing</span>
      <span class="legend"><i style="background: var(--empty)"></i>geen data</span>
      <br>Elke 5 minuten gemeten vanaf Cloudflare. Elk blokje is één dag.
    </p>
  </main>

  <footer>© <span id="year"></span> Wessel Smit</footer>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();

    const LABELS = {
      up: "Online",
      degraded: "Traag",
      down: "Storing",
      unknown: "Nog geen meting",
    };

    const dateFmt = new Intl.DateTimeFormat("nl-NL", { day: "numeric", month: "short", year: "numeric" });
    const timeFmt = new Intl.DateTimeFormat("nl-NL", { hour: "2-digit", minute: "2-digit" });

    function currentState(m) {
      if (!m.last) return "unknown";
      if (!m.last.ok) return "down";
      return m.last.slow ? "degraded" : "up";
    }

    function dayState(day) {
      if (!day || !day.total) return "";
      const pct = day.up / day.total;
      if (pct >= 0.99) return "up";
      if (pct >= 0.9) return "degraded";
      return "down";
    }

    function formatPct(up, total) {
      if (!total) return "–";
      const pct = (up / total) * 100;
      return (pct === 100 ? "100" : pct.toFixed(2)) + "%";
    }

    function ago(iso) {
      const s = Math.round((Date.now() - new Date(iso)) / 1000);
      if (s < 60) return "zojuist";
      const m = Math.round(s / 60);
      if (m < 60) return m + " min geleden";
      return timeFmt.format(new Date(iso));
    }

    function render(data) {
      const n = data.days;
      const today = new Date();
      const dayKeys = [];
      for (let i = n - 1; i >= 0; i--) {
        const d = new Date(Date.UTC(today.getUTCFullYear(), today.getUTCMonth(), today.getUTCDate() - i));
        dayKeys.push(d.toISOString().slice(0, 10));
      }

      const container = document.getElementById("services");
      container.innerHTML = "";

      const states = data.monitors.map(currentState);

      data.monitors.forEach((m, i) => {
        const state = states[i];
        const days = m.days || {};
        let up = 0, total = 0;
        for (const k of dayKeys) {
          if (days[k]) { up += days[k].up; total += days[k].total; }
        }

        const recent = (m.recent || []).filter((r) => r.ok);
        const avgMs = recent.length ? Math.round(recent.reduce((a, r) => a + r.ms, 0) / recent.length) : null;

        const el = document.createElement("section");
        el.className = "service " + state;
        el.style.setProperty("--i", i);

        const head = document.createElement("div");
        head.className = "service-head";
        head.innerHTML = '<span class="dot" aria-hidden="true"></span><h2></h2><a target="_blank" rel="noopener noreferrer"></a><span class="state"></span>';
        head.querySelector("h2").textContent = m.name;
        const link = head.querySelector("a");
        link.href = m.url;
        link.textContent = new URL(m.url).host;
        head.querySelector(".state").textContent = LABELS[state];
        el.appendChild(head);

        const bars = document.createElement("div");
        bars.className = "bars";
        bars.style.setProperty("--n", n);
        bars.setAttribute("role", "img");
        bars.setAttribute("aria-label", `Uptime ${m.name} afgelopen ${n} dagen: ${formatPct(up, total)}`);
        for (const k of dayKeys) {
          const d = days[k];
          const bar = document.createElement("span");
          bar.className = "bar " + dayState(d);
          const label = dateFmt.format(new Date(k + "T12:00:00Z"));
          bar.title = d && d.total ? `${label}: ${formatPct(d.up, d.total)} (${d.total} metingen)` : `${label}: geen data`;
          bars.appendChild(bar);
        }
        el.appendChild(bars);

        const foot = document.createElement("div");
        foot.className = "bars-foot";
        foot.innerHTML = `<span>${n} dagen geleden</span><span class="uptime">${formatPct(up, total)} uptime</span><span>vandaag</span>`;
        el.appendChild(foot);

        const stats = document.createElement("div");
        stats.className = "stats";
        const parts = [];
        if (m.last) {
          parts.push(`laatste check <b>${ago(m.last.t)}</b>`);
          parts.push(`http <b>${m.last.code || m.last.error || "–"}</b>`);
          parts.push(`responstijd <b>${m.last.ms} ms</b>`);
        }
        if (avgMs !== null) parts.push(`gem. 4 uur <b>${avgMs} ms</b>`);
        stats.innerHTML = parts.map((p) => `<span>${p}</span>`).join("");
        el.appendChild(stats);

        container.appendChild(el);
      });

      const summary = document.getElementById("summary");
      const text = document.getElementById("summary-text");
      let overall;
      if (states.every((s) => s === "unknown")) overall = "unknown";
      else if (states.includes("down")) overall = "down";
      else if (states.includes("degraded")) overall = "degraded";
      else overall = "up";

      summary.className = "summary " + overall;
      const downCount = states.filter((s) => s === "down").length;
      text.textContent = {
        up: "Alle systemen operationeel",
        degraded: "Sommige systemen reageren traag",
        down: downCount === 1 ? "1 systeem heeft een storing" : `${downCount} systemen hebben een storing`,
        unknown: "Nog geen metingen, de eerste volgt binnen 5 minuten",
      }[overall];
      document.getElementById("summary-meta").textContent = data.updated ? "bijgewerkt " + ago(data.updated) : "";
    }

    async function load() {
      try {
        const res = await fetch("/api/status", { cache: "no-store" });
        if (!res.ok) throw new Error(res.status);
        render(await res.json());
      } catch {
        document.getElementById("summary").className = "summary down";
        document.getElementById("summary-text").textContent = "Kon de status niet ophalen";
      }
    }

    load();
    setInterval(load, 60000);
  </script>
</body>
</html>
